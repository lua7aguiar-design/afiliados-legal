<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achadinhos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 480px; margin: 0 auto; padding: 2.8rem 1.2rem 3rem; min-height: 100vh;
    background: linear-gradient(180deg, #C091FBEB, #E06FFFEB, #45007CEB);
  }
  h1 {
    font-family: 'Fredoka', -apple-system, sans-serif; font-weight: 700; font-size: 2.1rem;
    color: #4D303B; text-align: center; margin: 0 0 1.6rem;
  }
  .cta {
    display: block; width: fit-content; text-align: center; color: #F7EAFF; font-weight: 700;
    font-size: 0.8rem; padding: 0.6rem 1.15rem; border-radius: 999px; background: #ED89EE;
    box-shadow: 0 4px 12px rgba(178, 102, 217, 0.35); margin: 0 auto 1.4rem;
  }
  .busca-wrap { position: relative; margin: 0 0 1.4rem; }
  .busca {
    width: 100%; padding: 0.75rem 1rem 0.75rem 2.7rem; border-radius: 999px;
    border: 1.5px solid #E4C6F0; background: #FFFFFF; color: #4D303B;
    font-family: inherit; font-size: 0.85rem;
  }
  .busca::placeholder { color: #B98FCB; }
  .busca:focus { outline: none; border-color: #E056C9; }
  .busca-icone {
    position: absolute; left: 0.95rem; top: 50%; transform: translateY(-50%);
    color: #C77FE0; pointer-events: none; display: flex;
  }
  .tabs { display: flex; gap: 0.5rem; overflow-x: auto; padding: 0.1rem 0.1rem 0.4rem; margin-bottom: 1.5rem; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; border: 1.5px solid #E4C6F0; background: #FFFFFF; color: #7A4A93;
    font-weight: 600; font-size: 0.78rem; padding: 0.5rem 1rem; border-radius: 999px;
    white-space: nowrap; cursor: pointer;
  }
  .tab-ativa { background: #E056C9; border-color: #E056C9; color: #FFFFFF; }
  .vazio { text-align: center; color: #F7EAFF; font-size: 0.85rem; margin: 1rem 0; }
  nav { display: flex; flex-direction: column; gap: 0.9rem; }
  nav a.card {
    display: flex; align-items: center; gap: 0.9rem; padding: 0.7rem; border-radius: 20px;
    background: #FFFFFF; box-shadow: 0 4px 14px rgba(60, 30, 20, 0.06); text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  nav a.card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(60, 30, 20, 0.12); }
  nav a.card img { width: 58px; height: 58px; border-radius: 15px; object-fit: cover; flex-shrink: 0; display: block; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.25rem; }
  .nome {
    font-size: 0.83rem; line-height: 1.3; color: #3A2E28; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .preco { color: #E056C9; font-weight: 700; font-size: 0.82rem; }
  .seta {
    width: 30px; height: 30px; border-radius: 999px; background: #FCE4F5; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0; color: #E056C9;
  }
  footer { text-align: center; color: rgba(255, 255, 255, 0.78); font-weight: 600; font-size: 0.7rem; margin: 2.4rem 0 0; }
</style>
</head>
<body>

<h1>Achadinhos</h1>
<span class="cta">Toque no produto para conferir 👇</span>

<div class="busca-wrap">
  <input class="busca" type="text" inputmode="numeric" autocomplete="off" placeholder="Digite o código do produto" id="busca">
  <span class="busca-icone">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
  </span>
</div>

<div class="tabs" id="tabs">
  <div class="tab" data-categoria="banheiro">Banheiro</div>
</div>

<nav id="produtos">
  <a class="card" href="https://s.shopee.com.br/5VUxxVZftE" target="_blank" rel="noopener sponsored" data-codigo="271" data-categoria="banheiro"><img src="https://cf.shopee.com.br/file/br-11134201-820l7-mqx5mt9mgz5xbd" alt=""><span class="info"><span class="nome">Suporte Organizador de Banheiro Multifuncional - Papel Higiênico e Lenços BEGE</span><span class="preco">R$ 37,90 &middot; cód. 271</span></span><span class="seta"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></span></a>
</nav>
<p class="vazio" id="sem-resultado" style="display: none;">Nenhum produto encontrado com esse código.</p>

<footer>Achadinhos da Shopee</footer>

<script>
  var categoriaAtiva = "banheiro";
  var campo = document.getElementById("busca");
  var tabs = document.getElementById("tabs");
  var cartoes = document.querySelectorAll("#produtos a[data-codigo]");
  var semResultado = document.getElementById("sem-resultado");

  function aplicarFiltro() {
    var termo = campo.value.trim();
    var buscando = termo !== "";
    var algumVisivel = false;
    cartoes.forEach(function (cartao) {
      var mostra = buscando
        ? cartao.getAttribute("data-codigo").indexOf(termo) !== -1
        : cartao.getAttribute("data-categoria") === categoriaAtiva;
      cartao.style.display = mostra ? "flex" : "none";
      if (mostra) algumVisivel = true;
    });
    tabs.style.display = buscando ? "none" : "flex";
    semResultado.style.display = buscando && !algumVisivel ? "block" : "none";
    tabs.querySelectorAll(".tab").forEach(function (tab) {
      tab.classList.toggle("tab-ativa", tab.getAttribute("data-categoria") === categoriaAtiva);
    });
  }

  tabs.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      categoriaAtiva = tab.getAttribute("data-categoria");
      campo.value = "";
      aplicarFiltro();
    });
  });
  campo.addEventListener("input", aplicarFiltro);
  aplicarFiltro();
</script>
</body>
</html>
