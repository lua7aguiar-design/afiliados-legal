<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achadinhos</title>
<style>
  :root {
    --bg: #EDEFEA; --surface: #F7F8F4; --ink: #1C1E1B; --muted: #5C6358;
    --accent: #3B6E5E; --line: #D8DBD3;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
    --serif: Iowan Old Style, "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141713; --surface: #191C16; --ink: #E9ECE4; --muted: #97A08D;
      --accent: #74C4A4; --line: #262922;
    }
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    color: var(--ink); font-family: var(--sans);
    max-width: 480px; margin: 0 auto; padding: 3.5rem 1.5rem 4rem; line-height: 1.5;
  }
  h1 {
    font-family: var(--serif); font-weight: 600; font-size: clamp(1.5rem, 6vw, 1.9rem);
    text-align: center; margin: 0 0 0.5rem;
  }
  .disclosure {
    text-align: center; color: var(--muted); font-family: var(--mono); font-size: 0.72rem;
    letter-spacing: 0.03em; margin-bottom: 1.6rem;
  }
  .busca {
    width: 100%; padding: 0.75rem 1rem; margin-bottom: 1.8rem; box-sizing: border-box;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    color: var(--ink); font-family: var(--sans); font-size: 0.9rem;
  }
  .busca::placeholder { color: var(--muted); }
  .busca:focus { outline: none; border-color: var(--accent); }
  nav { display: flex; flex-direction: column; gap: 0.8rem; }
  nav a {
    display: flex; justify-content: space-between; align-items: center; gap: 0.8rem;
    padding: 1rem 1.15rem; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink); text-decoration: none; font-size: 0.95rem;
  }
  nav a:hover { border-color: var(--accent); }
  nav a .info {
    display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; flex: 1;
  }
  nav a .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav a .codigo { font-family: var(--mono); font-size: 0.72rem; color: var(--accent); }
  nav a span.arrow { color: var(--accent); font-family: var(--mono); flex-shrink: 0; }
  .vazio { text-align: center; color: var(--muted); }
  footer {
    margin-top: 3rem; padding-top: 1.4rem; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 0.72rem; color: var(--muted); text-align: center;
  }
</style>
</head>
<body>

<h1>Achadinhos</h1>
<p class="disclosure">#publi · links de afiliado, posso ganhar comissão</p>

<input class="busca" type="text" inputmode="numeric" autocomplete="off"
  placeholder="Digite o código do produto" id="busca">

<nav id="produtos">
  <p class="vazio">Nenhum achadinho no ar agora — volta em breve.</p>
</nav>
<p class="vazio" id="sem-resultado" style="display: none;">Nenhum produto encontrado com esse código.</p>

<footer>Achadinhos da Shopee</footer>

<script>
  var campo = document.getElementById("busca");
  var cartoes = document.querySelectorAll("#produtos a[data-codigo]");
  var semResultado = document.getElementById("sem-resultado");
  campo.addEventListener("input", function () {
    var termo = campo.value.trim();
    var algumVisivel = false;
    cartoes.forEach(function (cartao) {
      var mostra = termo === "" || cartao.getAttribute("data-codigo").indexOf(termo) !== -1;
      cartao.style.display = mostra ? "flex" : "none";
      if (mostra) algumVisivel = true;
    });
    semResultado.style.display = termo !== "" && !algumVisivel ? "block" : "none";
  });
</script>
</body>
</html>
